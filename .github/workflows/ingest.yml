name: Daily ingest

on:
  schedule:
    - cron: "17 5 * * *"
      timezone: "Europe/Warsaw"

  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Refresh data
        run: PYTHONPATH=src uv run python scripts/refresh_all.py