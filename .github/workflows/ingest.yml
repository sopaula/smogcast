
name: Daily ingest

on:
  schedule:
    - cron: "17 4 * * *"

  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show start time
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u)"
          echo "Poland: $(TZ=Europe/Warsaw date)"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Refresh data
        run: |
          echo "Refresh started: $(TZ=Europe/Warsaw date)"
          PYTHONPATH=src uv run python scripts/refresh_all.py
          echo "Refresh finished: $(TZ=Europe/Warsaw date)"

      - name: Show end time
        if: always()
        run: |
          echo "Workflow ended: $(TZ=Europe/Warsaw date)"
